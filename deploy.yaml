import:
  - recipe/laravel.php

config:
  repository: "git@github.com:ardyprayogo/sudindikjs1.git"
  keep_releases: 2
hosts:
  vm.sdnlebakbulus02.sch.id:
    staging:
    hostname: vm.sdnlebakbulus02.sch.id
    remote_user: deploy
    deploy_path: "~/modules/sudindikjs1"
    branch: development
    ssh_multiplexing: false
    labels:
      stage: staging

tasks:
  npm:install:build:
    - cd: "{{release_path}}"
    - run: "source $HOME/.nvm/nvm.sh && npm install && npm run build"

after:
  deploy:failed: deploy:unlock
  deploy:vendors: npm:install:build
